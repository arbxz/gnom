name: Release

# Build, sign, and publish a GitHub Release with updater artifacts whenever a
# version tag (e.g. v0.2.0) is pushed. tauri-action also generates the
# `latest.json` manifest the app's updater reads.
#
# Requires the repo secret TAURI_SIGNING_PRIVATE_KEY (contents of
# %USERPROFILE%\.tauri\gnom.key). See docs/releasing-updates.md.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          # Provided automatically by Actions — used to create the release.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing. The key has no password, so the password secret is
          # optional; if unset, this resolves to an empty string (correct).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "gnom ${{ github.ref_name }}"
          releaseBody: "Download the installer below. Existing installs update themselves."
          releaseDraft: false
          prerelease: false
